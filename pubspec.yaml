name: motoalert
description: Modular Flutter Android app for ESP32 BLE LCD control and ultrasonic proximity alerts.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_reactive_ble: ^5.6.0
  permission_handler: ^11.3.1
  device_info_plus: ^11.3.0
  flutter_local_notifications: ^20.1.0
  audioplayers: ^6.8.1
  vibration: ^3.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/proximity_alert.wav
